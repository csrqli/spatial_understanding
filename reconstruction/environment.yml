name: q35-omega-reproduction
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip=25.1
  - numpy=2.2.6
  - pillow=12.3.0
  - scipy=1.15.3
  - pandas=2.3.0
  - pyarrow=20.0.0
  - pyyaml
  - git
  - git-lfs
  - pip:
      # The local run used the official CUDA 12.8 PyTorch wheels. The +cu128
      # suffix prevents pip from silently choosing a CPU build.
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.9.0+cu128
      - torchvision==0.24.0+cu128
      - torchaudio==2.9.0+cu128
      - transformers==5.20.2
      - tokenizers==0.23.3
      - huggingface_hub==2.3.0
      - accelerate==1.8.1
      - peft==0.21.2
      - safetensors==0.8.0
      - datasets==3.6.0
      - flash-linear-attention==0.5.2
      - fla-core==0.5.2
      - einops==0.8.1
      - timm==1.0.19
      - qwen-vl-utils==0.0.11
      - opencv-python-headless==4.11.0.86
      - sentencepiece==0.2.0
      - decord==0.6.0
      - imageio==2.37.4
      - protobuf==4.25.8
      - ninja==1.11.1.4
